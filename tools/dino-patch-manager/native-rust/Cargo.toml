[package]
name = "dino-native-manager"
version = "0.2.0"
edition = "2021"
publish = false
description = "Native Rust LilacAnime patch manager (independent from upstream Electron)"
license = "MIT"

[features]
default = []
gui = ["dep:eframe", "dep:rfd", "dep:wgpu"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"], optional = true }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }
wgpu = { version = "27", default-features = false, features = ["dx12"], optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
