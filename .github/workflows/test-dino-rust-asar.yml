name: Verify DinoPatch Rust read-only ASAR inspector

on:
  push:
    branches:
      - feature/dino-rust-asar-verifier
    paths:
      - tools/dino-patch-manager/rust-engine/**
      - .github/workflows/test-dino-rust-asar.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-windows:
    name: Compile and test on Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/dino-patch-manager/rust-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Run read-only safety tests
        shell: pwsh
        run: cargo test --all-targets --verbose
      - name: Produce internal test binary (not a release)
        shell: pwsh
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "Rust build failed" }
          if (-not (Test-Path -LiteralPath 'target/release/dino-asar-inspect.exe' -PathType Leaf)) {
            throw "Rust binary missing"
          }

  official-linux-asar:
    name: Verify upstream v0.5.64 ASAR header and identity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/dino-patch-manager/rust-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build read-only verifier
        run: cargo build --release
      - name: Fetch official ASAR into isolated CI temporary directory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/official-deb" "$RUNNER_TEMP/official-extract" "$RUNNER_TEMP/asar-fixture/resources"
          gh release download v0.5.64 \
            --repo whispelyn-byte/LilacAnime-desktop \
            --pattern LilacAnime-linux-amd64.deb \
            --dir "$RUNNER_TEMP/official-deb"
          dpkg-deb -x "$RUNNER_TEMP/official-deb/LilacAnime-linux-amd64.deb" "$RUNNER_TEMP/official-extract"
          ASAR="$(find "$RUNNER_TEMP/official-extract" -type f -name app.asar | head -n 1)"
          test -f "$ASAR"
          cp -- "$ASAR" "$RUNNER_TEMP/asar-fixture/resources/app.asar"
          # Linux package lacks LilacAnime.exe. This only tests the official
          # ASAR bytes against the scanner, not an actual Windows installation.
          touch "$RUNNER_TEMP/asar-fixture/LilacAnime.exe"
          "$GITHUB_WORKSPACE/tools/dino-patch-manager/rust-engine/target/release/dino-asar-inspect" "$RUNNER_TEMP/asar-fixture" | tee "$RUNNER_TEMP/rust-inspect-result.json"
          python3 - "$RUNNER_TEMP/rust-inspect-result.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding='utf-8'))
          assert result['status'] == 'ARCHIVE_VALID', result
          assert result['version'] == '0.5.64', result
          assert result['readOnly'] is True, result
          assert len(result['sha256']) == 64, result
          print('Read-only official ASAR verification passed')
          PY

  official-windows-v064:
    name: Verify genuine official Windows v0.5.64 installation ASAR
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Windows read-only verifier
        shell: pwsh
        run: |
          Push-Location tools/dino-patch-manager/rust-engine
          try {
            cargo build --release
            if ($LASTEXITCODE -ne 0) { throw 'Native Rust inspector build failed' }
          } finally {
            Pop-Location
          }
      - name: Download and extract genuine official Windows installer into temporary CI storage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'official-windows-download'
          $extract = Join-Path $env:RUNNER_TEMP 'official-windows-extract'
          New-Item -ItemType Directory -Force -Path $download,$extract | Out-Null
          gh release download 'v0.5.64' --repo whispelyn-byte/LilacAnime-desktop --pattern 'LilacAnime-Setup.exe' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Official installer download failed' }
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw 'Windows 7-Zip is unavailable' }
          & $sevenZip x (Join-Path $download 'LilacAnime-Setup.exe') "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          $archives = @(Get-ChildItem -LiteralPath $extract -Filter app.asar -Recurse -File)
          if ($archives.Count -eq 0) {
            $payloads = @(Get-ChildItem -LiteralPath $extract -Recurse -File | Where-Object { $_.Name -match '^app-.*[.]7z$' })
            foreach ($payload in $payloads) {
              $inside = Join-Path $extract 'application-content'
              New-Item -ItemType Directory -Force -Path $inside | Out-Null
              & $sevenZip x $payload.FullName "-o$inside" -y | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Nested payload extraction failed: $($payload.Name)" }
            }
            $archives = @(Get-ChildItem -LiteralPath $extract -Filter app.asar -Recurse -File)
          }
          if ($archives.Count -ne 1) { throw "Expected exactly one official app.asar, found $($archives.Count)" }
          $asar = $archives[0].FullName
          $install = Split-Path (Split-Path $asar -Parent) -Parent
          $exe = Join-Path $install 'LilacAnime.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Official LilacAnime.exe missing' }
          $initial = (Get-FileHash -LiteralPath $asar -Algorithm SHA256).Hash
          $inspector = Join-Path (Get-Location).Path 'tools/dino-patch-manager/rust-engine/target/release/dino-asar-inspect.exe'
          $json = (& $inspector $install | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Rust inspection rejected official Windows ASAR: $json" }
          $result = $json | ConvertFrom-Json
          if ($result.status -ne 'ARCHIVE_VALID' -or $result.version -ne '0.5.64' -or $result.readOnly -ne $true) {
            throw "Unexpected official Windows ASAR result: $json"
          }
          if ($result.sha256 -ne $initial) { throw 'Rust and PowerShell SHA-256 do not match' }
          if ((Get-FileHash -LiteralPath $asar -Algorithm SHA256).Hash -ne $initial) { throw 'Inspection modified original app.asar' }
          Write-Host 'Official Windows ASAR v0.5.64 read-only verification passed'
