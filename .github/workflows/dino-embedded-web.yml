name: Dino embedded ChatGPT patch checks
on:
  push:
    branches:
      - codex/dino-chatgpt-web-translation
      - codex/dino-chatgpt-logged-out-test
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-and-upstream:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare isolated official upstream source copies
        shell: pwsh
        run: |
          $base = node -p "require('node:os').tmpdir()"
          $v14 = Join-Path $base 'dino-web-upstream-v0514'
          $v15 = Join-Path $base 'dino-web-upstream-v0515'
          git clone --depth 1 --branch v0.5.14 https://github.com/whispelyn-byte/LilacAnime-desktop.git $v14
          if ($LASTEXITCODE -ne 0) { throw 'v0.5.14 clone failed' }
          git clone --depth 1 --branch v0.5.15 https://github.com/whispelyn-byte/LilacAnime-desktop.git $v15
          if ($LASTEXITCODE -ne 0) { throw 'v0.5.15 clone failed' }
          "LILAC_UPSTREAM_SOURCE=$v14" >> $env:GITHUB_ENV
          "LILAC_UPSTREAM_V0514_SOURCE=$v14" >> $env:GITHUB_ENV
          "LILAC_UPSTREAM_V0515_SOURCE=$v15" >> $env:GITHUB_ENV
      - name: Install dev dependencies
        run: npm ci
      - name: Check patched source syntax
        run: |
          node --check electron/embedded-chatgpt-web.cjs
          node --check tests/chatgpt-logged-out-live.electron.cjs
          node --check tests/run-chatgpt-logged-out-live.cjs
          node --check tests/run-isolated-animation-playback.cjs
          node --check tests/isolated-animation-playback.electron.cjs
          node --check tests/run-miruro-live-episode.cjs
          node --check tests/miruro-live-episode.electron.cjs
          node --check electron/patch-manager-stage2.cjs
          node --check src/patch-manager-stage2.js
          node --check patch-manager/adapters/lilacanime-v0.5.14.cjs
          node --check patch-manager/adapters/lilacanime-independent.cjs
      - name: Test embedded UI bridge and independent patch variants
        run: |
          node --test patch-manager/test/embedded-chatgpt-web.test.cjs
          node --test patch-manager/test/chatgpt-logged-out.test.cjs
          node --test patch-manager/test/lilacanime-independent.test.cjs
      - name: Anonymous ChatGPT web navigation smoke (no credentials)
        continue-on-error: true
        run: node tests/run-chatgpt-logged-out-live.cjs
      - name: Isolated animated-video playback (decoded moving frames)
        run: node tests/run-isolated-animation-playback.cjs
      - name: Full Node regression suite
        run: npm test

  miruro-live-episode:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Miruro Frieren episode 1 live playback (isolated, upstream-dependent)
        id: miruro_live
        timeout-minutes: 4
        env:
          DINO_MIRURO_LIVE_OPT_IN: '1'
        run: node tests/run-miruro-live-episode.cjs
      - name: Record live episode result
        if: always()
        shell: pwsh
        run: |
          $outcome = "${{ steps.miruro_live.outcome }}"
          Write-Output "Miruro live episode probe outcome: $outcome"
          Write-Output "This job is separate from the Node regression job."
          if ($outcome -ne 'success') {
            Write-Output "::error::Miruro live episode probe FAILED/BLOCKED. Real-episode playback is NOT VERIFIED; inspect the live-test step log."
            "## Miruro live episode: FAIL / BLOCKED" >> $env:GITHUB_STEP_SUMMARY
            "The live provider test failed in this job. The independent Node regression job reports its own result." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "## Miruro live episode: SHORT PLAYBACK PROBE PASSED" >> $env:GITHUB_STEP_SUMMARY
            "Audible sound, on-screen subtitle rendering, and full episode completion remain unverified." >> $env:GITHUB_STEP_SUMMARY
          }
