name: Probe DinoPatch Electron Node Reuse

on:
  push:
    branches: [test/dino-full-functional-integration]
    paths: [.github/workflows/probe-electron-node.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Download already built release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path pkg -Force | Out-Null
          gh run download 43012176628 --repo dinoforge/lilac-dino-patch --name LilacAnime-DinoPatch-Windows-x64 --dir pkg
          if ($LASTEXITCODE -ne 0) { throw 'Cannot obtain known-good archive' }
          Expand-Archive -LiteralPath 'pkg/LilacAnime-DinoPatch-Windows-x64.zip' -DestinationPath pkg/expanded -Force

      - name: Capture Electron Node stdout and exit code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Get-Location).Path 'pkg/expanded/DinoPatchManager/LilacAnime-DinoPatch.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Packed executable absent' }
          $psi = [System.Diagnostics.ProcessStartInfo]::new($exe)
          $psi.ArgumentList.Add('-p')
          $psi.ArgumentList.Add('process.versions.node')
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.Environment['ELECTRON_RUN_AS_NODE'] = '1'
          $p = [System.Diagnostics.Process]::Start($psi)
          try {
            $exited = $p.WaitForExit(20000)
            if (-not $exited) { $p.Kill($true); throw 'Electron did not exit in node mode' }
            $out = $p.StandardOutput.ReadToEnd()
            $errText = $p.StandardError.ReadToEnd()
            Write-Host "Exit code: $($p.ExitCode)"
            Write-Host "Stdout: $out"
            Write-Host "Stderr: $errText"
            if ($p.ExitCode -ne 0 -or $out -notmatch '^[0-9]+\\.[0-9]+\\.[0-9]+') {
              throw 'Electron does not act as compatible Node CLI'
            }
          } finally {
            $p.Dispose()
          }
