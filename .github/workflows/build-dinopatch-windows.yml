name: Build LilacAnime DinoPatch Windows ZIP

on:
  push:
    branches:
      - test/dino-full-functional-integration
    paths:
      - .github/workflows/build-dinopatch-windows.yml
      - tools/dino-patch-manager/tests/theme-leveldb-electron.integration.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out manager source
        uses: actions/checkout@v4

      - name: Set up locked Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Set up locked Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
          architecture: x64

      - name: Prepare locked build tools
        shell: pwsh
        run: |
          npm install --global npm@11.11.0
          if ($LASTEXITCODE -ne 0) { throw "npm setup failed" }
          python -m venv .venv-dino-build
          if ($LASTEXITCODE -ne 0) { throw "Python venv setup failed" }
          & .\.venv-dino-build\Scripts\python.exe -m pip install -r tools\dino-patch-manager\requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Python locked dependencies failed" }

      - name: Build LilacAnime DinoPatch x64
        shell: pwsh
        run: |
          & .\tools\dino-patch-manager\build_electron_windows.ps1 -PythonExe .\.venv-dino-build\Scripts\python.exe -BuildName github-renamed
          if ($LASTEXITCODE -ne 0) { throw "Manager Windows build failed" }

      - name: Keep only licensed production runtime modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path (Get-Location).Path 'tools/dino-patch-manager/release/LilacAnime-DinoPatch-Electron-v1.2.4-github-renamed/win-unpacked'
          $nodeRuntime = Join-Path $root 'resources/manager-node'
          $modules = Join-Path $nodeRuntime 'node_modules'
          $prod = Join-Path $env:RUNNER_TEMP 'dinopatch-production-modules'
          New-Item -ItemType Directory -Path $prod -Force | Out-Null
          Copy-Item -LiteralPath 'tools/dino-patch-manager/electron-app/package.json' -Destination $prod
          Copy-Item -LiteralPath 'tools/dino-patch-manager/electron-app/package-lock.json' -Destination $prod
          Push-Location $prod
          try {
            npm ci --omit=dev --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Production-only npm install failed' }
          } finally {
            Pop-Location
          }
          if (Test-Path -LiteralPath (Join-Path $prod 'node_modules/electron')) { throw 'Dev-only Electron unexpectedly installed' }
          if (Test-Path -LiteralPath (Join-Path $prod 'node_modules/electron-builder')) { throw 'Dev-only electron-builder unexpectedly installed' }
          $native = @(Get-ChildItem -LiteralPath (Join-Path $prod 'node_modules/classic-level') -Recurse -File -Filter '*.node')
          if ($native.Count -eq 0) { throw 'ClassicLevel native Windows runtime is missing' }
          $oldModules = Join-Path $env:RUNNER_TEMP 'dinopatch-old-dev-node-modules'
          if (Test-Path -LiteralPath $oldModules) { throw 'Unexpected old runtime destination' }
          Move-Item -LiteralPath $modules -Destination $oldModules
          Copy-Item -LiteralPath (Join-Path $prod 'node_modules') -Destination $nodeRuntime -Recurse
          $runtimeModules = @(Get-ChildItem -LiteralPath $modules -Directory)
          if ($runtimeModules.Count -gt 20) { throw "Unexpected production package count: $($runtimeModules.Count)" }
          Write-Host "Production-only runtime package count: $($runtimeModules.Count)"
          if (Test-Path -LiteralPath $oldModules) {
            Remove-Item -LiteralPath $oldModules -Recurse -Force -ErrorAction Stop
          }

      - name: Remove non-Windows binaries and duplicate UI dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path (Get-Location).Path 'tools/dino-patch-manager/release/LilacAnime-DinoPatch-Electron-v1.2.4-github-renamed/win-unpacked'
          $localeDir = Join-Path $app 'locales'
          $keep = @('ko', 'en-US')
          $removed = @(Get-ChildItem -LiteralPath $localeDir -File -Filter '*.pak' | Where-Object { $_.BaseName -notin $keep })
          if ($removed.Count -gt 0) { $removed | Remove-Item -Force -ErrorAction Stop }
          foreach ($language in $keep) {
            if (-not (Test-Path -LiteralPath (Join-Path $localeDir "$language.pak") -PathType Leaf)) { throw "Required UI locale missing: $language" }
          }
          $appMain = Get-Content -LiteralPath 'tools/dino-patch-manager/electron-app/main.cjs' -Raw
          if (-not $appMain.Contains("'manager-node', 'node_modules'")) { throw 'Manager external LevelDB runtime contract changed; refuse duplicate removal' }
          $duplicate = Join-Path $app 'resources/app.asar.unpacked/node_modules'
          if (Test-Path -LiteralPath $duplicate) {
            Remove-Item -LiteralPath $duplicate -Recurse -Force -ErrorAction Stop
          }
          $prebuilds = Join-Path $app 'resources/manager-node/node_modules/classic-level/prebuilds'
          foreach ($dir in @(Get-ChildItem -LiteralPath $prebuilds -Directory)) {
            if ($dir.Name -ne 'win32-x64') { Remove-Item -LiteralPath $dir.FullName -Recurse -Force -ErrorAction Stop }
          }
          $native = @(Get-ChildItem -LiteralPath (Join-Path $prebuilds 'win32-x64') -Filter '*.node' -File)
          if ($native.Count -eq 0) { throw 'Win-x64 LevelDB binary was removed' }
          Write-Host "Pruned $($removed.Count) unused locale packs, duplicate Electron native modules and cross-OS LevelDB prebuilds"

      - name: Create ZIP and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $built = 'tools/dino-patch-manager/release/LilacAnime-DinoPatch-Electron-v1.2.4-github-renamed/win-unpacked'
          $stage = Join-Path (Get-Location).Path 'package-staging'
          $manager = Join-Path $stage 'DinoPatchManager'
          $artifacts = Join-Path (Get-Location).Path 'build-artifacts'
          $zip = Join-Path $artifacts 'LilacAnime-DinoPatch-Windows-x64.zip'
          New-Item -ItemType Directory -Path $manager,$artifacts -Force | Out-Null
          Get-ChildItem -LiteralPath $built -Force | Copy-Item -Destination $manager -Recurse -Force
          foreach ($required in @(
            'LilacAnime-DinoPatch.exe',
            'resources/app.asar',
            'resources/manager-engine/DinoPatchManagerEngine.exe',
            'resources/manager-engine/_internal/patches/patch03/manifest.json',
            'resources/manager-node/node_modules/classic-level/package.json'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $manager $required) -PathType Leaf)) {
              throw "ZIP input is incomplete: $required"
            }
          }
          $licences = Join-Path $manager 'THIRD_PARTY_LICENSES'
          New-Item -ItemType Directory -Path $licences -Force | Out-Null
          $nodeDir = Split-Path -Parent ((Get-Command node -ErrorAction Stop).Source)
          $nodeLicence = Join-Path $nodeDir 'LICENSE'
          if (-not (Test-Path -LiteralPath $nodeLicence -PathType Leaf)) {
            $nodeLicence = Join-Path $env:RUNNER_TEMP 'node-v22.22.0-LICENSE'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/nodejs/node/v22.22.0/LICENSE' -OutFile $nodeLicence -TimeoutSec 60
          }
          $pythonLicence = Join-Path $env:pythonLocation 'LICENSE.txt'
          if (-not (Test-Path -LiteralPath $pythonLicence -PathType Leaf)) {
            $pythonLicence = Join-Path $env:RUNNER_TEMP 'cpython-v3.14.7-LICENSE'
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/python/cpython/v3.14.7/LICENSE' -OutFile $pythonLicence -TimeoutSec 60
          }
          foreach ($item in @(@($nodeLicence, 'Node.js-LICENSE.txt'), @($pythonLicence, 'Python-LICENSE.txt'))) {
            if (-not (Test-Path -LiteralPath $item[0] -PathType Leaf)) { throw "Missing runtime license: $($item[0])" }
            Copy-Item -LiteralPath $item[0] -Destination (Join-Path $licences $item[1]) -ErrorAction Stop
          }
          foreach ($item in @('LICENSE.electron.txt', 'LICENSES.chromium.html')) {
            if (-not (Test-Path -LiteralPath (Join-Path $manager $item) -PathType Leaf)) { throw "Missing bundled Electron/Chromium notice: $item" }
          }
          $modules = Join-Path $manager 'resources/manager-node/node_modules'
          foreach ($name in @('classic-level','abstract-level','module-error','napi-macros','node-gyp-build','buffer','is-buffer','level-supports','level-transcoder','maybe-combine-errors','base64-js','ieee754')) {
            $module = Join-Path $modules $name
            $notice = @(Get-ChildItem -LiteralPath $module -File | Where-Object { ($_.Name -like 'LICENSE*') -or ($_.Name -like 'LICENCE*') })
            if ($notice.Count -eq 0) { throw "Missing npm dependency license: $name" }
          }
          if ((Get-ChildItem -LiteralPath $licences -File).Count -ne 2) { throw 'Runtime license files were not collected' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip)
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $zipFiles = @($archive.Entries | Where-Object { -not $_.FullName.EndsWith('/') })
            $sourceFiles = @(Get-ChildItem -LiteralPath $manager -File -Recurse -Force)
            if ($zipFiles.Count -ne $sourceFiles.Count) {
              throw "ZIP file count mismatch: archive=$($zipFiles.Count) source=$($sourceFiles.Count)"
            }
          } finally {
            $archive.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          Set-Content -LiteralPath (Join-Path $artifacts 'SHA256SUMS.txt') -Value "$hash  LilacAnime-DinoPatch-Windows-x64.zip" -Encoding ascii
          Write-Host "ZIP: LilacAnime-DinoPatch-Windows-x64.zip"
          Write-Host "SHA-256: $hash"
          Write-Host "Source commit: $env:GITHUB_SHA"

      - name: Save private build artifact (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-DinoPatch-Windows-x64
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
