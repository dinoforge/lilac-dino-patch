name: Verify official Windows LilacAnime ASAR installation

on:
  push:
    branches: [test/dino-full-functional-integration]
    paths:
      - .github/workflows/test-official-windows-installed.yml
      - tools/dino-patch-manager/tests/verify_official_installed_asar.py
      - tools/dino-patch-manager/installed_asar.py
      - tools/dino-patch-manager/manager_core.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version: ['0.5.54', '0.5.55', '0.5.63']
    steps:
      - uses: actions/checkout@v4

      - name: Download genuine official Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'original-installer'
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          gh release download "v${{ matrix.version }}" --repo whispelyn-byte/LilacAnime-desktop --pattern 'LilacAnime-Setup.exe' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Official download failed' }

      - name: Extract nested NSIS payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'original-installer/LilacAnime-Setup.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'official-extracted'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw 'Windows 7-Zip is unavailable' }
          & $sevenZip x $installer "-o$destination" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          $archives = @(Get-ChildItem -LiteralPath $destination -Filter 'app.asar' -Recurse -File)
          if ($archives.Count -eq 0) {
            $payloads = @(Get-ChildItem -LiteralPath $destination -Recurse -File | Where-Object { $_.Name -match '^app-.*[.]7z$' })
            Write-Host "Extracted NSIS nested payloads: $($payloads.Count)"
            foreach ($payload in $payloads) {
              $inside = Join-Path $destination 'application-content'
              New-Item -ItemType Directory -Path $inside -Force | Out-Null
              & $sevenZip x $payload.FullName "-o$inside" -y | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Nested payload extraction failed: $($payload.Name)" }
            }
            $archives = @(Get-ChildItem -LiteralPath $destination -Filter 'app.asar' -Recurse -File)
          }
          if ($archives.Count -ne 1) {
            Get-ChildItem -LiteralPath $destination -Recurse -File | Select-Object -First 20 -ExpandProperty FullName | Out-Host
            throw "Expected one installed app.asar; found $($archives.Count)"
          }
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'dino-asar-location.txt') -Value $archives[0].FullName
          Write-Host "Found official Windows v${{ matrix.version }} app.asar"

      - name: Verify pinned files, patch and byte-exact restore in temp copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asar = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'dino-asar-location.txt') -Raw).Trim()
          $patched = Join-Path $env:RUNNER_TEMP 'verified-patched-app.asar'
          & python tools/dino-patch-manager/tests/verify_official_installed_asar.py $asar '${{ matrix.version }}' $patched
          if ($LASTEXITCODE -ne 0) { throw 'Windows ASAR compatibility test failed' }
          if (-not (Test-Path -LiteralPath $patched -PathType Leaf)) { throw 'Patched ASAR smoke-test copy missing' }

      - name: Compare genuine app startup before and after ASAR patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asar = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'dino-asar-location.txt') -Raw).Trim()
          $exe = Join-Path (Split-Path (Split-Path $asar -Parent) -Parent) 'LilacAnime.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'Official Windows executable not found next to resources/app.asar'
          }
          $backup = Join-Path $env:RUNNER_TEMP 'official-app-before-launch.asar'
          Copy-Item -LiteralPath $asar -Destination $backup
          function Invoke-AppProbe {
            $psi = [System.Diagnostics.ProcessStartInfo]::new($exe)
            $psi.UseShellExecute = $false
            $psi.WorkingDirectory = Split-Path -Parent $exe
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardError = $true
            $psi.RedirectStandardOutput = $true
            $psi.Environment['ELECTRON_ENABLE_LOGGING'] = '1'
            $psi.ArgumentList.Add('--disable-gpu')
            $psi.ArgumentList.Add('--no-sandbox')
            $process = [System.Diagnostics.Process]::Start($psi)
            try {
              Start-Sleep -Seconds 5
              $alive = -not $process.HasExited
              $code = if ($alive) { 'running' } else { "$($process.ExitCode)" }
              Write-Host "Process probe: $code"
              if (-not $alive) {
                $errorLines = $process.StandardError.ReadToEnd()
                $outLines = $process.StandardOutput.ReadToEnd()
                Write-Host "Process stderr: $($errorLines.Substring(0, [Math]::Min($errorLines.Length, 2500)))"
                Write-Host "Process stdout: $($outLines.Substring(0, [Math]::Min($outLines.Length, 1200)))"
              }
              return @{ alive = $alive; exitCode = $code }
            } finally {
              if (-not $process.HasExited) { $process.Kill($true) }
              $process.WaitForExit(10000) | Out-Null
              $process.Dispose()
            }
          }
          try {
            $baseline = Invoke-AppProbe
            Start-Sleep -Seconds 2
            $survivors = @(Get-CimInstance Win32_Process | Where-Object {
              $_.Name -ieq 'LilacAnime.exe' -and $_.ExecutablePath -and $_.ExecutablePath -ieq $exe
            })
            Write-Host "Previous app instances after cleanup: $($survivors.Count)"
            if ($survivors.Count -gt 0) {
              $survivors | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop }
              Start-Sleep -Seconds 2
            }
            Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'verified-patched-app.asar') -Destination $asar -Force
            $patched = Invoke-AppProbe
            if ($baseline.alive -and -not $patched.alive) {
              throw "Official app launched before patch but failed after patch (exit=$($patched.exitCode))."
            }
            if ($baseline.exitCode -ne $patched.exitCode) {
              throw "App startup changed unexpectedly: baseline=$($baseline.exitCode) patched=$($patched.exitCode)"
            }
            Write-Host 'Official Windows launch behavior unchanged after ASAR patch'
          } finally {
            Copy-Item -LiteralPath $backup -Destination $asar -Force
          }
