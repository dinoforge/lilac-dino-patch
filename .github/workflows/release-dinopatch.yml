name: Publish LilacAnime DinoPatch Beta Release

# Patch-only independent manager release. The upstream-application build gate
# in .github/workflows/build.yml is unchanged; it controls a different artifact.
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-dinopatch.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: 857834cd7491f399119d62fcd572a4c18c261234
      BUILD_RUN: "43029640074"
      RELEASE_TAG: dino-v0.1.0-beta.4
      ZIP_NAME: LilacAnime-DinoPatch-Windows-x64.zip
    steps:
      - name: Check out scoped redistribution review
        uses: actions/checkout@v4

      - name: Confirm patch-only review is documented
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/PATCH_ONLY_RELEASE_REVIEW.md
          grep -q '공식 LilacAnime Desktop 전체' docs/PATCH_ONLY_RELEASE_REVIEW.md
          test "$GITHUB_REPOSITORY" = "dinoforge/lilac-dino-patch"

      - name: Wait for the exact Windows build and verify source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 35); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .status)"
            if [[ "$status" == "completed" ]]; then break; fi
            sleep 20
          done
          actual_commit="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_sha)"
          actual_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .conclusion)"
          test "$actual_commit" = "$EXPECTED_COMMIT"
          test "$actual_status" = "success"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Existing release must not be overwritten."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Existing tag must not be reused."
            exit 1
          fi

      - name: Download exact build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name LilacAnime-DinoPatch-Windows-x64 --dir release-files
          test -s "release-files/$ZIP_NAME"
          test -s release-files/SHA256SUMS.txt

      - name: Check patch-only content, runtime notices and ZIP checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          sha256sum --check SHA256SUMS.txt
          printf "%s  %s\n" "B1FC0E388984C1FF3676F6ACFFF1EC78C70751C48400452BBCB8FE1C13C6B378" "$ZIP_NAME" | sha256sum --check --status
          unzip -tqq "$ZIP_NAME"
          unzip -Z1 "$ZIP_NAME" > zip-entries.txt
          for file in \
            "DinoPatchManager/LilacAnime-DinoPatch.exe" \
            "DinoPatchManager/resources/app.asar" \
            "DinoPatchManager/resources/manager-engine/DinoPatchManagerEngine.exe" \
            "DinoPatchManager/resources/manager-engine/_internal/patches/patch03/manifest.json" \
            "DinoPatchManager/resources/manager-engine/_internal/src/integrated-search.js" \
            "DinoPatchManager/resources/manager-engine/_internal/src/integrated-search.css" \
            "DinoPatchManager/resources/manager-engine/_internal/patches/patch03/patch03-bridge.js" \
            "DinoPatchManager/resources/manager-node/node_modules/classic-level/package.json" \
            "DinoPatchManager/LICENSE.electron.txt" \
            "DinoPatchManager/LICENSES.chromium.html" \
            "DinoPatchManager/THIRD_PARTY_LICENSES/Node.js-LICENSE.txt" \
            "DinoPatchManager/THIRD_PARTY_LICENSES/Python-LICENSE.txt"; do
            grep -xF "$file" zip-entries.txt >/dev/null || { echo "::error::Required patch or license missing: $file"; exit 1; }
          done
          if grep -xF "DinoPatchManager/resources/manager-node/node.exe" zip-entries.txt; then
            echo "::error::Duplicate node.exe must not be bundled."
            exit 1
          fi
          if grep -F "DinoPatchManager/resources/app.asar.unpacked/node_modules/" zip-entries.txt; then
            echo "::error::Duplicate bundled Electron native modules present."
            exit 1
          fi
          for locale in ko en-US; do
            grep -xF "DinoPatchManager/locales/$locale.pak" zip-entries.txt >/dev/null || { echo "::error::Essential locale missing: $locale"; exit 1; }
          done
          if grep -Ei '\.(mp4|mkv|avi|srt|vtt|ass)$' zip-entries.txt; then
            echo "::error::Video or subtitle files must not be bundled."
            exit 1
          fi
          if grep -E '^DinoPatchManager/(src/app\.js|src/index\.html|src/logo\.png|build/icon\.|electron/main\.cjs|resources/manager-node/node_modules/(electron|electron-builder|app-builder-lib)/)' zip-entries.txt; then
            echo "::error::Official application or build-only dependency detected."
            exit 1
          fi
          for name in classic-level abstract-level module-error napi-macros node-gyp-build buffer is-buffer level-supports level-transcoder maybe-combine-errors base64-js ieee754; do
            grep -Eiq "^DinoPatchManager/resources/manager-node/node_modules/${name}/(LICENSE|LICENCE)(\\.[^/]*)?$" zip-entries.txt || {
              echo "::error::npm license missing: $name"
              exit 1
            }
          done
          echo "Verified bundle SHA-256: $(sha256sum "$ZIP_NAME" | cut -d' ' -f1)"

      - name: Create independent patch-only prerelease
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum "release-files/$ZIP_NAME" | cut -d' ' -f1)"
          cat > release-notes.md <<'EOF'
          ## LilacAnime DinoPatch 0.1.0 Beta 4

          비공식 Windows x64용 **독립 패치 관리자**입니다. 공식 LilacAnime Desktop 설치 파일이나 전체 소스는 포함하지 않습니다.

          통합 검색, 공급원 선택, 호환성 확인, 패치 자동 적용, 해제 및 백업 복원을 제공합니다.

          경량화: 중복 Node.js 실행 파일과 다른 운영체제용 바이너리, 중복 네이티브 모듈, 사용하지 않는 언어팩을 제거했습니다. 한국어와 영어 UI는 유지합니다. 내장 Node 검사, LevelDB, Python 패치 엔진 연결 검사를 통과했습니다.

          UI 변경: **고급 도구 접기 기능을 없애서** 재검사, 패치 해제, 백업·복원, 업데이트 확인 버튼이 항상 보입니다. 중복 세부 정보와 불필요한 안내문, 상태창 앞 빈 여백을 제거했습니다.

          설치본 지원: **버전 번호만으로 차단하지 않고** `app.asar` 내부 실제 파일, 패치 연결점, 검색·상세·재생 IPC 호출 계약을 검사합니다. 기존 공식 v0.5.54·v0.5.55는 파일 지문 검사도 유지합니다. 공식 v0.5.63까지 Windows 설치본에서 패치·원복·실행 검사를 통과했습니다. 다른 버전도 필수 구조가 호환되는 경우에만 적용하며, 변경 또는 확인 불가 시에는 원본을 보호하고 중단합니다. 앱 종료 후 원본 ASAR 전체를 백업합니다.

          사용법: LilacAnime를 종료한 뒤 ZIP을 풀고 `DinoPatchManager` 폴더의 `LilacAnime-DinoPatch.exe`를 실행하세요. `원본 폴더 변경`을 눌러 `LilacAnime.exe`와 `resources/app.asar`가 있는 공식 설치 폴더를 선택합니다. 기존 소스 폴더 방식도 지원합니다.

          내장 Node.js/Python/Electron 및 npm 런타임에 대한 제3자 라이선스 고지가 패키지에 포함되어 있습니다. 영상과 자막 파일은 제공하지 않습니다. 공식 LilacAnime 프로젝트의 승인을 받은 제품이 아닙니다.

          EOF
          printf "\n소스 커밋: %s\nZIP SHA-256: %s\n" "$EXPECTED_COMMIT" "$sha" >> release-notes.md
          gh release create "$RELEASE_TAG" "release-files/$ZIP_NAME" "release-files/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$EXPECTED_COMMIT" \
            --prerelease \
            --title "LilacAnime DinoPatch 0.1.0 Beta 4" \
            --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets
