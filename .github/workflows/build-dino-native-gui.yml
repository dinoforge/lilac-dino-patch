name: Package DinoPatch Rust-native Windows UI

on:
  push:
    branches: [feature/dino-native-rust-manager]
    paths:
      - tools/dino-patch-manager/native-rust/**
      - .github/workflows/build-dino-native-gui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/dino-patch-manager/native-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile the entire native Rust desktop manager
        shell: pwsh
        run: |
          cargo fmt --all
          cargo build --release --features gui
          if ($LASTEXITCODE -ne 0) { throw 'Rust desktop manager could not compile' }
          if (-not (Test-Path -LiteralPath 'target/release/dino-native-manager.exe' -PathType Leaf)) { throw 'Native Rust executable missing' }
      - name: Smoke-test real Rust Windows GUI startup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path (Get-Location).Path 'target/release/dino-native-manager.exe'
          # Reproduce the reported app.asar-as-directory state without
          # modifying or deleting a real installation or an existing backup.
          $fixture=Join-Path $env:RUNNER_TEMP 'dino-invalid-asar-fixture'
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture 'resources/app.asar') | Out-Null
          Set-Content -LiteralPath (Join-Path $fixture 'LilacAnime.exe') -Value 'CI marker'
          $env:DINO_ORIGINAL_ROOT=$fixture
          $env:APPDATA=Join-Path $env:RUNNER_TEMP 'dino-native-smoke-profile'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $psi=[System.Diagnostics.ProcessStartInfo]::new($exe)
          $psi.UseShellExecute=$false
          $psi.CreateNoWindow=$false
          $psi.RedirectStandardError=$true
          $proc=[System.Diagnostics.Process]::Start($psi)
          if (-not $proc) { throw 'Native Rust GUI did not launch' }
          try {
            Start-Sleep -Seconds 18
            if ($proc.HasExited) {
              $errorText=$proc.StandardError.ReadToEnd()
              throw "Rust GUI terminated immediately (code=$($proc.ExitCode)): $errorText"
            }
            if (-not (Test-Path -LiteralPath (Join-Path $fixture 'resources/app.asar') -PathType Container)) {
              throw 'Native Rust GUI modified the invalid original ASAR folder'
            }
            if (@(Get-ChildItem -LiteralPath $env:APPDATA -Recurse -File -Filter original-app.asar).Count -ne 0) {
              throw 'GUI created an unexpected original ASAR backup for an invalid folder'
            }
            $log=Join-Path $env:APPDATA 'DinoPatchManager/native-manager.log'
            if (-not (Test-Path -LiteralPath $log -PathType Leaf)) {
              throw 'Rust native startup diagnostic log was not generated'
            }
            Write-Host 'Native Rust GUI stayed open for 18 seconds with invalid ASAR directory and preserved the source'
          } finally {
            if (-not $proc.HasExited) { $proc.Kill($true) }
            $proc.WaitForExit(10000) | Out-Null
            $proc.Dispose()
          }
      - name: Create Rust-only portable package
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'dino-native-release'
          $stage=Join-Path $root 'DinoPatchManager'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath 'target/release/dino-native-manager.exe' -Destination (Join-Path $stage 'LilacAnime-DinoPatch-Rust.exe')
          $zip=Join-Path $env:RUNNER_TEMP 'LilacAnime-DinoPatch-Rust-Windows-x64.zip'
          Compress-Archive -LiteralPath $stage -DestinationPath $zip -CompressionLevel Optimal
          if (@(Get-ChildItem -LiteralPath $stage -Recurse -File).Count -ne 1) { throw 'Unexpected files in native package' }
          $sha=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          Write-Host "Portable native Rust ZIP SHA-256: $sha"
          Write-Host "Portable native Rust ZIP bytes: $((Get-Item $zip).Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: DinoPatch-Rust-Native-Windows-TEST
          path: ${{ runner.temp }}/LilacAnime-DinoPatch-Rust-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
