name: Native Rust DinoPatch patch and restore

# This one-off branch verifies the compatibility migration on a genuine
# Windows installation; production/dev workflows remain manual-only.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/dino-windows-sqlite-smoke
    paths:
      - .github/workflows/test-dino-native-rust.yml

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/dino-patch-manager/native-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual Windows SQLite file, migration and Korean-title precedence
        working-directory: .
        run: node --test tests/dino-sqlite-compat.test.cjs
      - name: Run integrated source and quality regression tests
        run: node --test ../../../tests/patch03-global-integration.test.cjs
      - name: Format native Rust source before compilation
        run: cargo fmt --all
      - name: Native Rust unit tests
        run: cargo test --no-default-features
      - name: Native Windows binary
        run: cargo build --release --no-default-features
      - name: Official Windows v0.5.64 patch, backup, manual reset and byte-exact restore
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'native-profile'
          $download = Join-Path $env:RUNNER_TEMP 'official-download'
          $extract = Join-Path $env:RUNNER_TEMP 'official-extract'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$download,$extract | Out-Null
          gh release download v0.5.64 --repo whispelyn-byte/LilacAnime-desktop --pattern LilacAnime-Setup.exe --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Official installer download failed' }
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          & $sevenZip x (Join-Path $download 'LilacAnime-Setup.exe') "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          $archives = @(Get-ChildItem -LiteralPath $extract -Filter app.asar -Recurse -File)
          if ($archives.Count -eq 0) {
            $payloads = @(Get-ChildItem -LiteralPath $extract -Recurse -File | Where-Object { $_.Name -match '^app-.*[.]7z$' })
            foreach ($payload in $payloads) {
              $dest = Join-Path $extract 'application-content'
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              & $sevenZip x $payload.FullName "-o$dest" -y | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Nested archive extraction failed: $($payload.Name)" }
            }
            $archives = @(Get-ChildItem -LiteralPath $extract -Filter app.asar -Recurse -File)
          }
          if ($archives.Count -ne 1) { throw "Expected one official ASAR, found $($archives.Count)" }
          $asar = $archives[0].FullName
          $install = Split-Path (Split-Path $asar -Parent) -Parent
          if (-not (Test-Path -LiteralPath (Join-Path $install 'LilacAnime.exe') -PathType Leaf)) { throw 'Official Windows EXE missing' }
          $exe = Join-Path (Get-Location).Path 'target/release/dino-native-manager.exe'
          $beforeHash = (Get-FileHash -LiteralPath $asar -Algorithm SHA256).Hash
          function Run-Manager([string]$cmd) {
            $output = (& $exe $cmd $install | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "$cmd failed: $output" }
            return ($output | ConvertFrom-Json)
          }
          $before = Run-Manager 'inspect'
          if ($before.status -ne 'UNPATCHED' -or $before.version -ne '0.5.64') { throw "Unexpected original status: $($before | ConvertTo-Json -Compress)" }
          $applied = Run-Manager 'apply'
          if ($applied.status -ne 'APPLIED') { throw "Patch did not apply: $($applied | ConvertTo-Json -Compress)" }
          # Verify the actual patched archive contains both optional SQLite
          # files and the additive preload/main bridge, not just an APPLIED flag.
          $env:DINO_VERIFY_ASAR=$asar
          @'
import os,sys
from pathlib import Path
sys.path.insert(0,os.path.join(os.environ['GITHUB_WORKSPACE'],'tools','dino-patch-manager'))
from installed_asar import Archive
a=Archive(Path(os.environ['DINO_VERIFY_ASAR']))
files=('src/integrated-search.js','src/dino-sqlite-sync.js',
       'electron/dino-work-db.cjs','src/patch03-bridge.js')
for name in files:
    data=a.read(name)
    assert len(data)>100, f'Missing or empty SQLite patch runtime: {name}'
preload=a.read('electron/preload.cjs').decode('utf-8')
main=a.read('electron/main.cjs').decode('utf-8')
html=a.read('src/index.html').decode('utf-8')
assert "dinoWorkIndex:" in preload
assert "require('./dino-work-db.cjs').register" in main
assert html.count('<script src="dino-sqlite-sync.js"></script>')==1
print('PASS: Official installed ASAR contains the SQLite IPC and renderer runtime')
'@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'SQLite ASAR verification failed' }
          if ((Get-FileHash -LiteralPath $asar -Algorithm SHA256).Hash -eq $beforeHash) { throw 'ASAR was not patched' }
          $uninstalled = Run-Manager 'uninstall'
          if ($uninstalled.status -ne 'UNPATCHED' -or -not $uninstalled.manualUninstall) { throw 'Manual uninstall was not recorded' }
          if ((Get-FileHash -LiteralPath $asar -Algorithm SHA256).Hash -ne $beforeHash) { throw 'Restored ASAR differs from original' }
          if ((Run-Manager 'startup').status -ne 'UNPATCHED') { throw 'Automatic check reinstalled a manually removed patch' }
          if ((Run-Manager 'apply').status -ne 'APPLIED') { throw 'Manual reapply failed' }
          [void](Run-Manager 'uninstall')
          if ((Get-FileHash -LiteralPath $asar -Algorithm SHA256).Hash -ne $beforeHash) { throw 'Second restore differs from original' }
          $backups = @(Get-ChildItem -LiteralPath $env:APPDATA -Recurse -File -Filter original-app.asar)
          if ($backups.Count -ne 1) { throw "Expected one retained original backup; found $($backups.Count)" }
          if ((Get-FileHash -LiteralPath $backups[0].FullName -Algorithm SHA256).Hash -ne $beforeHash) { throw 'Original backup corrupted' }
          # A verified, interrupted transaction can only be reconciled after
          # checking current ASAR and retained original backup.
          $stateFiles=@(Get-ChildItem -LiteralPath $env:APPDATA -Recurse -File -Filter state.json)
          if ($stateFiles.Count -ne 1) { throw 'Expected exactly one native manager state file' }
          $dataDir=$stateFiles[0].DirectoryName
          $pending=Join-Path $dataDir 'pending.json'
          $pendingJson=Get-Content -LiteralPath $stateFiles[0].FullName -Raw | ConvertFrom-Json
          $pendingJson.status='APPLIED'
          $pendingJson | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $pending -Encoding UTF8
          $blocked=Run-Manager 'inspect'
          if ($blocked.status -ne 'PARTIAL_OR_UNKNOWN') { throw 'Pending record did not block new patch' }
          $review=Run-Manager 'review'
          if (-not $review.recoveryAvailable) { throw 'Verified backup and pending state were not recognized' }
          $recovered=Run-Manager 'recover'
          if ($recovered.status -ne 'UNPATCHED' -or -not $recovered.manualUninstall) { throw 'Recovered original state was not preserved' }
          if (Test-Path -LiteralPath $pending) { throw 'Reconciled pending marker was not archived' }
          if (@(Get-ChildItem -LiteralPath $dataDir -File -Filter 'pending.reconciled-*.json').Count -ne 1) { throw 'Reconciled marker audit archive missing' }
          if ((Get-FileHash -LiteralPath $asar -Algorithm SHA256).Hash -ne $beforeHash) { throw 'Recovery unexpectedly modified the original ASAR' }
          Write-Host 'PASS: native Rust installed-app apply/manual-uninstall/restore and pending reconciliation parity'
          "DINO_GUI_SMOKE_ROOT=$install" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DINO_GUI_SMOKE_APPDATA=$env:APPDATA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DINO_GUI_SMOKE_ASAR_SHA=$beforeHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile standalone Rust desktop UI without Electron
        shell: pwsh
        run: |
          cargo build --release --features gui
          if ($LASTEXITCODE -ne 0) { throw 'Native Rust GUI compilation failed' }
          if (-not (Test-Path -LiteralPath 'target/release/dino-native-manager.exe' -PathType Leaf)) { throw 'Rust GUI binary missing' }
      - name: Verify GUI executable does not allocate a CMD console
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path (Get-Location).Path 'target/release/dino-native-manager.exe'
          $bytes=[System.IO.File]::ReadAllBytes($exe)
          $offset=[BitConverter]::ToInt32($bytes,0x3C)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid PE header' }
          $subsystem=[BitConverter]::ToUInt16($bytes,$offset+24+68)
          if ($subsystem -ne 2) { throw "Unexpected console subsystem: $subsystem" }
          Write-Host 'PASS: Rust manager uses native Windows GUI subsystem, not CMD'
      - name: Keep Electron-style Rust GUI alive during automatic check on genuine official ASAR
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:DINO_ORIGINAL_ROOT=$env:DINO_GUI_SMOKE_ROOT
          $env:APPDATA=$env:DINO_GUI_SMOKE_APPDATA
          $exe=Join-Path (Get-Location).Path 'target/release/dino-native-manager.exe'
          $psi=[System.Diagnostics.ProcessStartInfo]::new($exe)
          $psi.UseShellExecute=$false
          $psi.CreateNoWindow=$false
          $psi.RedirectStandardError=$true
          $proc=[System.Diagnostics.Process]::Start($psi)
          if (-not $proc) { throw 'Unable to launch Rust UI on official installation test fixture' }
          try {
            Start-Sleep -Seconds 18
            if ($proc.HasExited) {
              $stderr=$proc.StandardError.ReadToEnd()
              throw "Rust UI exited during official ASAR auto-check: code=$($proc.ExitCode), $stderr"
            }
            $asar=Join-Path $env:DINO_ORIGINAL_ROOT 'resources/app.asar'
            if ((Get-FileHash -LiteralPath $asar -Algorithm SHA256).Hash -ne $env:DINO_GUI_SMOKE_ASAR_SHA) {
              throw 'Rust UI automatic monitor modified a manually uninstalled official ASAR'
            }
            $log=Join-Path $env:APPDATA 'DinoPatchManager/native-manager.log'
            if (-not (Test-Path -LiteralPath $log -PathType Leaf)) {
              throw 'Missing persistent native Rust GUI diagnostic log'
            }
            Write-Host 'PASS Rust UI stayed open during actual Windows v0.5.64 original ASAR automatic inspection'
          } finally {
            if (-not $proc.HasExited) { $proc.Kill($true) }
            [void]$proc.WaitForExit(10000)
            $proc.Dispose()
          }
      - name: Package a minimal single-executable Windows ZIP
        shell: pwsh
        run: |
          $stage=Join-Path $env:RUNNER_TEMP 'native-dino-staging'
          $manager=Join-Path $stage 'DinoPatchManager'
          New-Item -ItemType Directory -Force -Path $manager | Out-Null
          Copy-Item 'target/release/dino-native-manager.exe' (Join-Path $manager 'LilacAnime-DinoPatch-Rust.exe')
          $zip=Join-Path $env:RUNNER_TEMP 'LilacAnime-DinoPatch-Rust-Windows-x64.zip'
          Compress-Archive -LiteralPath $manager -DestinationPath $zip -CompressionLevel Optimal
          if ((@(Get-ChildItem -LiteralPath $manager -Recurse -File)).Count -ne 1) { throw 'Unexpected files in Rust ZIP' }
          Get-FileHash -LiteralPath $zip -Algorithm SHA256 | Format-Table -AutoSize | Out-Host
          Write-Host "Rust native ZIP bytes: $((Get-Item $zip).Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: DinoPatch-Native-Rust-Windows-x64-test
          path: ${{ runner.temp }}/LilacAnime-DinoPatch-Rust-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
