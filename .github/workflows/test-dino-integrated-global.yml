name: DinoPatch global integrated-source regression tests

on:
  push:
    branches: [feature/dino-native-rust-manager]
    paths:
      - src/integrated-search.js
      - src/dino-sqlite-sync.js
      - src/integrated-search.css
      - patches/patch03/**
      - tests/patch03-global-integration.test.cjs
      - tests/integrated-search.test.cjs
      - tests/patch03-settings-preservation.test.cjs
      - tests/dino-sqlite-compat.test.cjs
      - tools/dino-patch-manager/native-rust/src/transaction.rs
      - tools/dino-patch-manager/manager_core.py
      - scripts/validate-patch03-clean-source.cjs
      - tests/dino-native-manager-ui.test.cjs
      - tools/dino-patch-manager/native-rust/src/**
      - tools/dino-patch-manager/native-rust/Cargo.toml
      - .github/workflows/build-dino-native-gui.yml
      - .github/workflows/test-dino-integrated-global.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check patch runtime syntax
        run: |
          node --check src/integrated-search.js
          node --check src/dino-sqlite-sync.js
          node --check patches/patch03/patch03-bridge.js
          node --check patches/patch03/dino-work-db.cjs
      - name: Verify global integration, missing-provider retries and real quality UI
        run: |
          node --test tests/patch03-global-integration.test.cjs
          node --test tests/integrated-search.test.cjs
          node --test tests/patch03-settings-preservation.test.cjs
          node --test tests/dino-sqlite-compat.test.cjs
          node --test tests/dino-manual-link.test.cjs
          node --test tests/dino-episode-refresh.test.cjs
      - name: Verify native Rust manager UI and console-free Windows build contract
        run: node --test tests/dino-native-manager-ui.test.cjs
      - name: Check both legacy and SQLite-extended Python patch manifests
        shell: bash
        run: |
          python3 - <<'PY'
          import copy, json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/dino-patch-manager')
          import manager_core
          manifest = json.loads(Path('patches/patch03/manifest.json').read_text(encoding='utf-8'))
          manager_core.validate_manifest(manifest)
          legacy = copy.deepcopy(manifest)
          legacy.pop('optionalConnections', None)
          legacy['officialRuntimeModifiedAllowlist'] = ['src/app.js', 'src/index.html']
          legacy['runtimeModules'] = [m for m in legacy['runtimeModules']
                                      if m['destination'] not in ('src/dino-sqlite-sync.js', 'electron/dino-work-db.cjs')]
          manager_core.validate_manifest(legacy)
          print('PASS: both old and SQLite-safe patch-manager manifests accepted')
          PY
      - name: Verify patch manifest module SHA-256
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('patches/patch03/manifest.json').read_text(encoding='utf-8'))
          for module in manifest['runtimeModules']:
              path = Path(module['source'])
              actual = hashlib.sha256(path.read_bytes()).hexdigest().upper()
              assert actual == module['sha256'], (str(path), actual, module['sha256'])
          print('PASS: Rust-embedded runtime module hashes match pinned manifest')
          PY
