name: SIWC isolated regression tests
on:
  push:
    branches:
      - codex/patch-02-siwc-runtime
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-siwc:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SIWC OAuth, signed ID tokens and streaming translation
        run: node --test patch-manager/test/siwc-contract.test.cjs patch-manager/test/siwc-oidc.test.cjs patch-manager/test/siwc-client.test.cjs
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Full isolated project test suite
        run: npm test
