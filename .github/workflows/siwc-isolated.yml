name: SIWC isolated regression tests
on:
  push:
    branches:
      - codex/patch-02-siwc-runtime
      - codex/integration-all-branches-20261011
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-siwc:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SIWC OAuth, signed ID tokens and streaming translation
        run: node --test patch-manager/test/siwc-contract.test.cjs patch-manager/test/siwc-oidc.test.cjs patch-manager/test/siwc-client.test.cjs
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare isolated official LilacAnime v0.5.14 source fixture
        shell: pwsh
        run: |
          $nodeTemp = node -p "require('node:os').tmpdir()"
          $fixture = Join-Path $nodeTemp 'lilac-upstream-v0514'
          git clone --depth 1 --branch v0.5.14 https://github.com/whispelyn-byte/LilacAnime-desktop.git $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Cannot load official v0.5.14 test fixture' }
          "LILAC_UPSTREAM_SOURCE=$fixture" >> $env:GITHUB_ENV
      - name: Full isolated project test suite
        run: npm test
